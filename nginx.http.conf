# HTTP-only nginx config (pre-SSL / local bootstrap).
#
# start.sh installs this so the app is reachable on port 80 before you run
# setup_ssl.sh. Once you run `sudo ./setup_ssl.sh <domain> <email>`, the SSL
# template (nginx.conf) replaces this with an HTTPS config.

server {
    listen 80;
    server_name _;

    # Allow large video downloads/uploads.
    client_max_body_size 2048M;

    # Let's Encrypt http-01 challenge (so setup_ssl.sh works without downtime).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Built React app (vite build output), deployed to a www-data-readable path
    # by start.sh (nginx workers run as www-data and cannot read under /root).
    root /var/www/vidgen;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Android APK download — correct MIME type + force download.
    location ~ \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
