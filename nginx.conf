# Nginx config for the AI YouTube Video Generator (HTTPS / Let's Encrypt).
#
# This is a TEMPLATE: the literal token __DOMAIN__ is replaced with your real
# domain by setup_ssl.sh (which also provisions the Let's Encrypt certificate).
#
# - Port 80: serves the ACME http-01 challenge and redirects everything else to
#   HTTPS.
# - Port 443: TLS, serves the built React frontend and proxies /api + /media to
#   FastAPI (uvicorn) on 127.0.0.1:8003. Tuned for large downloads + SSE.

# ---- HTTP: ACME challenge + redirect to HTTPS --------------------------------
server {
    listen 80;
    server_name __DOMAIN__;

    # Let's Encrypt http-01 challenge files (served by certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the application --------------------------------------------------
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large video downloads/uploads.
    client_max_body_size 2048M;

    # Built React app (vite build output), deployed to a www-data-readable path
    # by start.sh (nginx workers run as www-data and cannot read under /root).
    root /var/www/vidgen;
    index index.html;

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI. SSE-friendly: no buffering, long read timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Required for Server-Sent Events (progress stream).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Produced media (per-job final_video.mp4 + thumbnail.jpg) served by FastAPI.
    location /media/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # Support HTTP range requests for video seeking.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
