# Nginx config for the AI YouTube Video Generator.
# - Serves the built React frontend on port 80.
# - Proxies /api/ to FastAPI (uvicorn) on port 8003.
# - Proxies /media/ (produced video + thumbnail) to FastAPI.
# - Tuned for large file downloads and Server-Sent Events.

server {
    listen 80;
    server_name _;

    # Allow large video downloads/uploads.
    client_max_body_size 2048M;

    # Built React app (vite build output).
    root /root/projects/vid_gen/frontend/dist;
    index index.html;

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI. SSE-friendly: no buffering, long read timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Required for Server-Sent Events (progress stream).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Produced media (final_video.mp4, thumbnail.jpg) served by FastAPI.
    location /media/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # Support HTTP range requests for video seeking.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
